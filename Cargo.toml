[package]
name = "atome" # Must be unique across all of crates.io
version = "0.8.18"
edition = "2021"
authors = ["Jonathan Stoff <JonathanLStoff@gmail.com>"]


description = "An async, `cpal`-based audio engine for Rust. `atome` gives you a small, composable API for building real-time audio applications — sample playback, mixing, routing, and DSP graphs — without wrestling with platform audio callbacks, device enumeration, or buffer management yourself."
license = "MIT"
repository = "https://github.com/jonathanlstoff/atome"
readme = "README.md"

keywords = ["audio", "async", "engine", "samples", "decode"]

# crates.io category *slugs*, which are lowercase and `::`-separated — not the
# display names. An unrecognised one is rejected at upload with a 400, after
# the crate has been packaged, so it is worth checking against
# https://crates.io/category_slugs before adding one.
categories = ["multimedia::audio", "multimedia::encoding"]

[dependencies]
atomic-queue = "2.2.0"
cpal = "0.18.2"
ringbuf = "0.5.1"


# --- Plugin hosting ---
# The truce-rack family: one crate of shared traits, one per plugin format. Any
# host format pulls in `truce-rack-core`, since that is where `Plugin`,
# `PluginScanner`, and `AudioBuffer` live — the vocabulary `plugins::Plugin`
# speaks to every backend through.
#
# Internal plugins need none of this: they are Rust functions, so that path
# stays available in a build with no plugin feature on at all.
truce-rack-core = { version = "1.1.5", optional = true, default-features = false }

# VST3 hosting, all platforms: `truce-rack-vst3` 1.1.5 is carried in-tree as
# `plugins::vst3_host` (with its fixes), so these are its own dependencies.
vst3 = { version = "0.3", optional = true }
libloading = { version = "0.8", optional = true }
# Reads a VST3 bundle's `moduleinfo.json` (vendor, sub-categories) without loading it.
serde_json = { version = "1", optional = true }

# AU v2 and v3 are Apple frameworks. Their crates are declared further down,
# under `[target.'cfg(target_vendor = "apple")'.dependencies]`, so a Linux or
# Windows build never pulls in their objc2 tree.

# --- Audio export ---
# FLAC writing, pure Rust. Default features off: its `par` thread pool, `serde`,
# and `log` are nothing the writer here uses.
flacenc = { version = "0.5", optional = true, default-features = false }

# --- Audio import ---
# Everything below is pulled in by an `import*` feature and by nothing else.

# The pure-Rust half of `import`, and the reason the module splits container
# from encoding: Symphonia does the same, so one demuxer feeds several decoders.
# Covers PCM (WAV/AIFF/CAF), MP3, AAC-LC, Vorbis, FLAC, and ALAC, plus the MP4,
# Matroska, and Ogg demuxers needed to reach them.
#
# `default-features = false` keeps out what no feature asked for — notably the
# metadata readers and the SIMD paths, which can be turned back on deliberately.
# AAC is deliberately absent: it is patent-pooled, so it is decoded only by
# the operating system (see src/import/aac.rs), never by a bundled decoder.
symphonia = { version = "0.6.0", optional = true, default-features = false, features = [
    "aiff",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }


# Opus. Chosen over `audiopus` because it implements Symphonia's decoder trait,
# so it drops into the same pipeline as everything above instead of being a
# second, differently-shaped decoder. Its default `bundled` feature builds
# libopus from source rather than expecting one on the system.
symphonia-adapter-libopus = { version = "0.3.0", optional = true }

# Audio Unit hosting, v2 and v3. Apple-only, and declared per-target rather
# than merely feature-gated so that off-target builds do not have to resolve or
# compile the objc2 bindings underneath them.
#
# The host is `truce-rack-au` / `truce-rack-au3` 1.1.5 carried in-tree
# (`plugins::au_host`, `plugins::au3_scan`): the crates declare `objc2-app-kit`
# for every Apple target, and AppKit does not exist on iOS, so an iOS app
# linking them failed. These are those crates' own dependencies, with the
# AppKit one (the Cocoa editor) moved to macOS.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-audio-toolbox = { version = "0.3", optional = true, features = [
    "AudioComponent",
    "AUComponent",
    "AudioUnit",
    "AudioUnitProperties",
    "MusicDevice",
    "objc2-core-foundation",
    "block2",
] }
objc2-core-audio-types = { version = "0.3", optional = true, features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", optional = true, features = [
    "CFBase",
    "CFString",
    "CFData",
    "CFArray",
    "CFError",
    "CFPropertyList",
    "CFURL",
    "CFRunLoop",
    "CFDate",
] }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSString",
    "NSURL",
    "NSArray",
    "NSGeometry",
] }

# The AU Cocoa editor: AppKit, so macOS alone.
[target.'cfg(target_os = "macos")'.dependencies]
# The VST3 host's bundle loading (`plugins::vst3_host`), macOS alone.
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = { version = "0.8", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSView", "NSResponder"] }
objc2-audio-toolbox = { version = "0.3", optional = true, features = ["AUCocoaUIView"] }

# The operating system's AAC decoder on Windows: Media Foundation. Apple's
# AudioToolbox and Android's MediaCodec are system frameworks declared by hand.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[features]
default = []

# --- Host backends ---

# ASIO output, via cpal's own ASIO backend, plus the `output::asio` helpers.
#
# Windows only in practice: cpal declares `asio-sys` as a Windows-target
# dependency and puts the ASIO host behind `#[cfg(windows)]`, so on other
# platforms this compiles but finds no ASIO host. Building it on Windows needs
# the ASIO SDK and LLVM/Clang on PATH — see cpal's README.
asio = ["cpal/asio"]

# --- Plugin formats ---
# Each one gates the matching module under `plugins`. Internal plugins are not
# in this list on purpose: they are plain Rust functions with nothing to link
# against, so `plugins::internal` is always compiled in.

# Steinberg VST 2.4 plugin hosting.
#
# No dependency yet, and no backend: truce-rack has no VST2 crate, and the
# `vst` crate on crates.io is unmaintained. This compiles `plugins::vst` (doc
# comments only) and nothing else. Read up on the VST 2 SDK licence before
# leaning on it either way — Steinberg no longer issues one.
vst = []

# Steinberg VST 3 plugin hosting, via `truce-rack-vst3`.
vst3 = ["dep:vst3", "dep:libloading", "dep:truce-rack-core", "dep:serde_json", "dep:core-foundation", "dep:core-foundation-sys"]

# Apple Audio Unit v2 hosting, through the in-tree copy of `truce-rack-au`
# (`plugins::au_host`). macOS/iOS only — on any other target the dependencies
# are not declared and the module is not compiled. The editor is macOS's alone.
au = [
    "dep:truce-rack-core",
    "dep:objc2",
    "dep:block2",
    "dep:objc2-audio-toolbox",
    "dep:objc2-core-audio-types",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
]

# Apple Audio Unit v3 (App Extension) hosting. Scanning is v3's own
# (`plugins::au3_scan`); the loaded instance is the same `AuPlugin` a v2 load
# makes, hence the same dependencies.
au3 = [
    "dep:truce-rack-core",
    "dep:objc2",
    "dep:block2",
    "dep:objc2-audio-toolbox",
    "dep:objc2-core-audio-types",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
]

# Convenience: every plugin format at once.
plugins = ["vst", "vst3", "au", "au3"]

# --- Audio import ---
# Reading audio in from a file. Split by what a build has to link against, not
# by format: `import` on its own stays pure Rust and needs no toolchain beyond
# cargo, while each codec that only exists as a C library is its own opt-in.

# PCM (WAV, AIFF, CAF), MP3, Vorbis, FLAC, ALAC — and the MP4, Matroska, and
# Ogg demuxing to get at them — through Symphonia; AAC (LC, HE-AAC v1 and v2)
# through the operating system's decoder only. Nothing here bundles an AAC
# decoder.
import = ["dep:symphonia", "dep:windows"]

# Kept so existing builds still resolve: HE-AAC is now the operating system's
# to decode, exactly like LC, and libfdk-aac is gone.
import-he-aac = ["import"]

# Opus, via libopus. Not pure Rust: builds the C library from source, so it
# needs a C compiler.
import-opus = ["import", "dep:symphonia-adapter-libopus"]

# Every format that has a working decoder today.
import-all = ["import", "import-he-aac", "import-opus"]

# --- Audio export ---
# Writing audio out: FLAC, frame by frame, in pure Rust. With `import` as well,
# `export::to_flac` turns anything import reads — a video's audio track
# included — into a FLAC file.
export = ["dep:flacenc"]

# No feature for AC-3, E-AC-3, DTS, DTS-HD MA, Dolby TrueHD, WMA, or AMR: none
# of them has a Rust decoder to point a feature at. `import::Encoding` still
# names them and identification still recognises them, so the failure is a
# clear "no decoder" rather than a misread file. See planning/TODO.md.

[[example]]
name = "to_flac"
required-features = ["import", "export"]
