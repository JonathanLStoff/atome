[package]
name = "atome" # Must be unique across all of crates.io
version = "0.8.0"
edition = "2021"
authors = ["Jonathan Stoff <JonathanLStoff@gmail.com>"]


description = "An async, `cpal`-based audio engine for Rust. `atome` gives you a small, composable API for building real-time audio applications — sample playback, mixing, routing, and DSP graphs — without wrestling with platform audio callbacks, device enumeration, or buffer management yourself."
license = "MIT"
repository = "https://github.com/jonathanlstoff/atome"
readme = "README.md"

keywords = ["audio", "async", "engine", "samples", "decode"]
categories = ["Multimedia", "Encoding"] 

[dependencies]
atomic-queue = "2.2.0"
cpal = "0.18.1"
ringbuf = "0.5.1"


# --- Plugin hosting ---
# The truce-rack family: one crate of shared traits, one per plugin format. Any
# host format pulls in `truce-rack-core`, since that is where `Plugin`,
# `PluginScanner`, and `AudioBuffer` live — the vocabulary `plugins::Plugin`
# speaks to every backend through.
#
# Internal plugins need none of this: they are Rust functions, so that path
# stays available in a build with no plugin feature on at all.
truce-rack-core = { version = "1.1.5", optional = true, default-features = false }

# VST3 hosting. All platforms.
truce-rack-vst3 = { version = "1.1.5", optional = true, default-features = false }

# AU v2 and v3 are Apple frameworks. Their crates are declared further down,
# under `[target.'cfg(target_vendor = "apple")'.dependencies]`, so a Linux or
# Windows build never pulls in their objc2 tree.

# --- Audio import ---
# Everything below is pulled in by an `import*` feature and by nothing else.

# The pure-Rust half of `import`, and the reason the module splits container
# from encoding: Symphonia does the same, so one demuxer feeds several decoders.
# Covers PCM (WAV/AIFF/CAF), MP3, AAC-LC, Vorbis, FLAC, and ALAC, plus the MP4,
# Matroska, and Ogg demuxers needed to reach them.
#
# `default-features = false` keeps out what no feature asked for — notably the
# metadata readers and the SIMD paths, which can be turned back on deliberately.
symphonia = { version = "0.6.0", optional = true, default-features = false, features = [
    "aac",
    "aiff",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }

# HE-AAC v1 and v2. Symphonia's own AAC decoder is LC only — SBR and PS are not
# in it — so the high band and parametric stereo need libfdk-aac behind it.
# C library, and its licence is not one to ship without reading.
symphonia-adapter-fdk-aac = { version = "0.2.0", optional = true }

# Opus. Chosen over `audiopus` because it implements Symphonia's decoder trait,
# so it drops into the same pipeline as everything above instead of being a
# second, differently-shaped decoder. Its default `bundled` feature builds
# libopus from source rather than expecting one on the system.
symphonia-adapter-libopus = { version = "0.3.0", optional = true }

# Audio Unit hosting, v2 and v3. Apple-only, and declared per-target rather
# than merely feature-gated so that off-target builds do not have to resolve or
# compile the objc2 bindings underneath them.
#
# `truce-rack-au3` scans for v3 App Extensions but hands the resulting
# `AudioComponentInstance` back to `truce-rack-au`'s `AuPlugin` to hold, which
# is why the `au3` feature turns on both crates.
[target.'cfg(target_vendor = "apple")'.dependencies]
truce-rack-au = { version = "1.1.5", optional = true, default-features = false }
truce-rack-au3 = { version = "1.1.5", optional = true, default-features = false }

[features]
default = []

# --- Host backends ---

# ASIO output, via cpal's own ASIO backend, plus the `output::asio` helpers.
#
# Windows only in practice: cpal declares `asio-sys` as a Windows-target
# dependency and puts the ASIO host behind `#[cfg(windows)]`, so on other
# platforms this compiles but finds no ASIO host. Building it on Windows needs
# the ASIO SDK and LLVM/Clang on PATH — see cpal's README.
asio = ["cpal/asio"]

# --- Plugin formats ---
# Each one gates the matching module under `plugins`. Internal plugins are not
# in this list on purpose: they are plain Rust functions with nothing to link
# against, so `plugins::internal` is always compiled in.

# Steinberg VST 2.4 plugin hosting.
#
# No dependency yet, and no backend: truce-rack has no VST2 crate, and the
# `vst` crate on crates.io is unmaintained. This compiles `plugins::vst` (doc
# comments only) and nothing else. Read up on the VST 2 SDK licence before
# leaning on it either way — Steinberg no longer issues one.
vst = []

# Steinberg VST 3 plugin hosting, via `truce-rack-vst3`.
vst3 = ["dep:truce-rack-vst3", "dep:truce-rack-core"]

# Apple Audio Unit v2 hosting, via `truce-rack-au`. macOS/iOS only — on any
# other target the dependency is not declared and the module is not compiled.
au = ["dep:truce-rack-au", "dep:truce-rack-core"]

# Apple Audio Unit v3 (App Extension) hosting, via `truce-rack-au3`. Scanning
# is v3's own; the loaded instance is `truce-rack-au`'s `AuPlugin`, hence both.
au3 = ["dep:truce-rack-au3", "dep:truce-rack-au", "dep:truce-rack-core"]

# Convenience: every plugin format at once.
plugins = ["vst", "vst3", "au", "au3"]

# --- Audio import ---
# Reading audio in from a file. Split by what a build has to link against, not
# by format: `import` on its own stays pure Rust and needs no toolchain beyond
# cargo, while each codec that only exists as a C library is its own opt-in.

# PCM (WAV, AIFF, CAF), MP3, AAC-LC, Vorbis, FLAC, ALAC — and the MP4,
# Matroska, and Ogg demuxing to get at them.
import = ["dep:symphonia"]

# HE-AAC v1 and v2, via libfdk-aac. Not pure Rust. Without this, an HE-AAC file
# is still identified correctly and still fails to decode, rather than being
# quietly decoded as plain LC and sounding wrong.
import-he-aac = ["import", "dep:symphonia-adapter-fdk-aac"]

# Opus, via libopus. Not pure Rust: builds the C library from source, so it
# needs a C compiler.
import-opus = ["import", "dep:symphonia-adapter-libopus"]

# Every format that has a working decoder today.
import-all = ["import", "import-he-aac", "import-opus"]

# No feature for AC-3, E-AC-3, DTS, DTS-HD MA, Dolby TrueHD, WMA, or AMR: none
# of them has a Rust decoder to point a feature at. `import::Encoding` still
# names them and identification still recognises them, so the failure is a
# clear "no decoder" rather than a misread file. See planning/TODO.md.
